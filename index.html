<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오사카 여행 동선 지도</title>
  <link rel="stylesheet" href="styles.css?v=20260906-google-1" />
</head>
<body>
  <div id="map" aria-label="Google Maps route map"></div>

  <button id="menu-toggle" class="fab menu-fab" aria-label="메뉴 열기">☰</button>
  <button id="locate" class="fab locate-fab" title="현재 위치">⌖</button>

  <section id="day-panel" class="floating-panel day-panel">
    <div class="eyebrow">OSAKA TRIP ROUTE</div>
    <h1>오사카 여행 동선</h1>
    <p id="day-summary">1일차 영수증과 메모 기준으로 시간순 정리</p>
    <div class="tabs" id="day-tabs"></div>
  </section>

  <aside id="timeline" class="floating-panel timeline"></aside>
  <section id="detail" class="floating-panel detail hidden"></section>

  <section id="key-panel" class="floating-panel key-panel hidden">
    <h2>Google Maps API 키 필요</h2>
    <p>이 버전은 실제 Google Maps JavaScript API로 렌더링해. 키를 한 번 입력하면 이 브라우저에 저장해서 다음에도 바로 열 수 있어.</p>
    <input id="api-key-input" type="password" placeholder="Google Maps API key" autocomplete="off" />
    <div class="actions">
      <button id="save-key">키 저장하고 지도 열기</button>
      <a id="clear-key" href="#">저장된 키 지우기</a>
    </div>
    <p class="hint">정적 GitHub Pages라 클라이언트 키는 공개될 수 있어. 실제 키는 Google Cloud에서 도메인 제한을 거는 게 안전해.</p>
  </section>

  <div id="map-error" class="floating-panel map-error hidden"></div>

  <script src="app.js?v=20260906-google-1"></script>
</body>
</html>
