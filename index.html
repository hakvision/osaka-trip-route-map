<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오사카 여행 동선 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQmMhiwNhcBwE0A0q8eUwZMrT7mw/3M=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=20260906-1" />
</head>
<body>
  <div id="map"></div>
  <header class="top-card">
    <div class="eyebrow">OSAKA TRIP ROUTE</div>
    <h1>오사카 여행 동선</h1>
    <p id="day-summary">1일차 영수증과 메모 기준으로 시간순 정리</p>
    <div class="tabs" id="day-tabs"></div>
  </header>
  <button id="locate" class="round-btn" title="현재 위치">⌖</button>
  <aside class="timeline" id="timeline"></aside>
  <section class="detail hidden" id="detail"></section>
  <div class="legend">
    <span><b class="dot meal"></b>식사/간식</span>
    <span><b class="dot shopping"></b>쇼핑</span>
    <span><b class="dot transfer"></b>이동/역</span>
    <span><b class="dot hotel"></b>호텔</span>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=20260906-1"></script>
</body>
</html>
